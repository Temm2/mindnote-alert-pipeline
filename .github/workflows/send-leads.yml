name: Send Notetaker Leads

on:
  schedule:
    - cron: "0 14 * * *"   # once/day UTC — adjust to your team's morning
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/send_leads.py
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_LEADS_BOT_TOKEN: ${{ secrets.TELEGRAM_LEADS_BOT_TOKEN }}
          TELEGRAM_LEADS_CHAT_ID: ${{ secrets.TELEGRAM_LEADS_CHAT_ID }}
